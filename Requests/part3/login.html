<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Supply Store - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="login-container">
        <h1>Sports Supply Store</h1>
        <h2>Customer Login</h2>
        <form id="loginForm">
            <input
                type="text"
                id="userId"
                placeholder="User ID"
                required
            >
            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >
            <button type="submit">
                Login
            </button>
        </form>
        <p id="loginMessage"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="login.js"></script>

</body>

</html>
