<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mayoral Election Form</title>
</head>
<body>
    <h1>Presidential Elections</h1>

    <form action="https://www.placeholder.com" method="GET">

        <fieldset>
            <legend>Voter Information</legend>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="ssn">Social Security Number:</label><br>
            <input type="text" id="ssn" name="ssn"><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Select your candidate</legend>
            <input type="radio" id="candidate1" name="candidate" value="Candidate 1">
            <label for="candidate1">Candidate #1</label><br>

            <input type="radio" id="candidate2" name="candidate" value="Candidate 2">
            <label for="candidate2">Candidate #2</label><br>

            <input type="radio" id="candidate3" name="candidate" value="Candidate 3">
            <label for="candidate3">Candidate #3</label><br>

            <input type="radio" id="candidate4" name="candidate" value="Candidate 4">
            <label for="candidate4">Candidate #4</label>
        </fieldset>

        <br>
        <input type="submit" value="Confirm Vote">

    </form>
    
</body>
</html>
